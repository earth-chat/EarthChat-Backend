<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Earth Chat 비밀번호 재설정</title>
</head>

<body style="margin:0;background:#f5f7fb;font-family:Arial,sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0" style="padding:60px 0;">
    <tr>
        <td align="center">

            <table width="520"
                   cellpadding="0"
                   cellspacing="0"
                   style="
                        background:#ffffff;
                        border-radius:18px;
                        box-shadow:0 12px 40px rgba(0,0,0,0.08);
                        overflow:hidden;
                   ">

                <!-- Header -->
                <tr>
                    <td style="padding:26px 30px;background:#2563eb;">
                        <div style="color:#ffffff;font-size:18px;font-weight:700;">
                            Earth Chat
                        </div>

                        <div style="
                                color:rgba(255,255,255,0.85);
                                font-size:12px;
                                margin-top:4px;
                        ">
                            Password Reset
                        </div>
                    </td>
                </tr>

                <!-- Content -->
                <tr>
                    <td style="padding:42px 32px;">

                        <div style="
                                font-size:18px;
                                font-weight:700;
                                color:#111827;
                        ">
                            비밀번호 재설정
                        </div>

                        <div style="
                                margin-top:10px;
                                font-size:14px;
                                color:#6b7280;
                                line-height:1.6;
                        ">
                            비밀번호 재설정 요청이 접수되었습니다.<br>
                            아래 버튼을 눌러 새로운 비밀번호를 설정해주세요.
                        </div>

                        <!-- Reset Button -->
                        <div style="margin:38px 0;text-align:center;">

                            <a th:href="${findPasswordUrl}"
                               style="
                                    display:inline-block;
                                    padding:16px 36px;
                                    background:#2563eb;
                                    color:#ffffff;
                                    text-decoration:none;
                                    border-radius:12px;
                                    font-size:16px;
                                    font-weight:700;
                               ">
                                비밀번호 재설정
                            </a>

                        </div>

                        <div style="
                                font-size:13px;
                                color:#6b7280;
                                line-height:1.7;
                        ">
                            • 이 링크는 보안을 위해 10분 동안만 유효합니다.<br>
                            • 비밀번호 변경 후 기존 링크는 즉시 폐기됩니다.<br>
                            • 요청하지 않았다면 이 메일을 무시해주세요.
                        </div>
                    </td>
                </tr>

                <!-- Footer -->
                <tr>
                    <td style="
                            padding:18px;
                            text-align:center;
                            background:#f9fafb;
                            font-size:11px;
                            color:#9ca3af;
                    ">
                        © 2026 Earth Chat. All rights reserved.
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
