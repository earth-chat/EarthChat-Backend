<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Earth Chat 인증 코드</title>
</head>

<body style="margin:0;background:#f5f7fb;font-family:Arial,sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0" style="padding:60px 0;">
    <tr>
        <td align="center">

            <table width="520" cellpadding="0" cellspacing="0"
                   style="background:#ffffff;border-radius:18px;
                          box-shadow:0 12px 40px rgba(0,0,0,0.08);
                          overflow:hidden;">

                <tr>
                    <td style="padding:26px 30px;background:#2563eb;">
                        <div style="color:#ffffff;font-size:18px;font-weight:700;">
                            Earth Chat
                        </div>
                        <div style="color:rgba(255,255,255,0.85);font-size:12px;margin-top:4px;">
                            Email Verification
                        </div>
                    </td>
                </tr>

                <tr>
                    <td style="padding:42px 32px;">

                        <div style="font-size:18px;font-weight:700;color:#111827;">
                            이메일 인증 코드
                        </div>

                        <div style="margin-top:10px;font-size:14px;color:#6b7280;line-height:1.6;">
                            가입을 완료하려면 아래 인증 코드를 입력해주세요.<br>
                            인증 코드는 보안을 위해 3분간만 유효합니다.
                        </div>

                        <div style="margin:38px 0;text-align:center;">
                            <div style="
                                display:inline-block;
                                padding:18px 34px;
                                background:#f3f4f6;
                                border:1px solid #e5e7eb;
                                border-radius:12px;
                            ">
                                <span style="
                                    font-size:34px;
                                    font-weight:800;
                                    letter-spacing:8px;
                                    color:#2563eb;
                                "
                                      th:text="${authCode}">
                                    123456
                                </span>
                            </div>
                        </div>

                        <div style="font-size:13px;color:#6b7280;line-height:1.7;">
                            • 요청하지 않았다면 이 메일은 무시하셔도 됩니다.<br>
                            • 보안을 위해 인증 코드는 외부에 노출하지 마세요.
                        </div>

                    </td>
                </tr>

                <tr>
                    <td style="padding:18px;text-align:center;
                               background:#f9fafb;
                               font-size:11px;
                               color:#9ca3af;">
                        © 2026 Earth Chat. All rights reserved.
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
